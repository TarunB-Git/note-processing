name: Signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate version tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a vX.Y.Z tag.'; exit 1; }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Check desktop organizer
        run: |
          python -m pip install ./desktop
          python -m unittest discover -s desktop/tests
          node --check desktop/src/note_processing/web/app.js
      - name: Check Android app
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Build signed APK and app bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing release secret: $name."
              exit 1
            fi
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/note-chat-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Verify version, signature, and package assets
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          version=$("$tools/aapt" dump badging "$apk" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Tag must match Android versionName.'; exit 1; }
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/bundle-verification.txt"
          grep -Fq 'jar verified.' "$RUNNER_TEMP/bundle-verification.txt"
          mkdir -p release-assets
          cp "$apk" "release-assets/note-chat-$RELEASE_TAG-arm64.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-assets/note-chat-$RELEASE_TAG.aab"
          cd release-assets
          sha256sum *.apk *.aab > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --generate-notes --title "Note Chat ${RELEASE_TAG#v}"
